[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcpkg-harbor"
version = "2.0.0"
description = "A binary cache server for vcpkg with plugin-based storage backends"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "vcpkg-harbor contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "minio>=7.2.20",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "aiofiles>=25.1.0",
    "boto3>=1.43.99",
    "azure-storage-blob>=12.30.2",
    "google-cloud-storage>=3.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "types-aiofiles>=25.1.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[project.scripts]
vcpkg-harbor = "vcpkg_harbor.__main__:main"

[project.entry-points."vcpkg_harbor.storage"]
minio = "vcpkg_harbor.storage.backends.minio:MinioBackend"
filesystem = "vcpkg_harbor.storage.backends.filesystem:FilesystemBackend"
s3 = "vcpkg_harbor.storage.backends.s3:S3Backend"
azure = "vcpkg_harbor.storage.backends.azure:AzureBackend"
gcs = "vcpkg_harbor.storage.backends.gcs:GCSBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/vcpkg_harbor"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=vcpkg_harbor --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B904"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
